# Aeterna Linux build configuration

AETERNA_NAME="Aeterna"
AETERNA_VERSION="0.1.0-dev"

TARGET_ARCH="x86_64"
TARGET_TRIPLET="x86_64-pc-linux-gnu"

KERNEL_VERSION="7.2.8"

LIBC="glibc"
COMPILER="gcc"
PACKAGE_MANAGER="apt"
PACKAGE_FORMAT="deb"

BOOT_MODE="uefi"
BOOTLOADER="grub"
ROOT_FILESYSTEM="ext4"

DEVELOPMENT_REPOSITORY="kali-rolling"

BUILD_JOBS="$(nproc)"
